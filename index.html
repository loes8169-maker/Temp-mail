<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Mail | Unique Disposable Inbox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo"><i class="fas fa-bolt"></i> X-MAIL</div>
            <p>Fast, Secure, and Anonymous</p>
        </header>

        <section class="main-card">
            <div class="input-group">
                <input type="text" id="mail-address" readonly placeholder="Generating email...">
                <button onclick="copyEmail()" class="copy-btn">
                    <i class="far fa-copy"></i> Copy
                </button>
            </div>

            <div class="action-grid">
                <button onclick="generateNewEmail()" class="grid-btn">
                    <i class="fas fa-plus"></i> New Mail
                </button>
                <button onclick="checkInbox()" class="grid-btn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button onclick="deleteMail()" class="grid-btn delete">
                    <i class="fas fa-trash-alt"></i> Delete
                </button>
            </div>
        </section>

        <section class="inbox-container">
            <h3><i class="fas fa-inbox"></i> Inbox</h3>
            <div id="inbox-list">
                <div class="empty-state">Waiting for incoming messages...</div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
