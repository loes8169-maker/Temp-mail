<!DOCTYPE html>
<html>
<head>
    <title>TempMail - Guerrilla Mail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📧 টেম্পোরারি মেইল (Guerrilla)</h1>
        
        <div class="email-box">
            <input type="text" id="email" readonly>
            <button id="copyBtn">📋 কপি</button>
            <button id="refreshBtn">🔄 রিফ্রেশ</button>
            <button id="newBtn">✨ নতুন ইমেল</button>
        </div>

        <div class="inbox">
            <h3>📥 ইনবক্স</h3>
            <ul id="messageList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
